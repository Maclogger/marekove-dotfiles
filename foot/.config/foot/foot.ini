[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=20
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
# Delete-word with Ctrl+Backspace. Ported from the old Alacritty config, which
# mapped Control+Backspace to the two-byte sequence ESC DEL.
# That is what Alt+Backspace already sends, and readline and TUIs read it as
# "delete previous word" -- so this makes both shortcuts equivalent.
\x1b\x7f=Control+BackSpace
