# SSH server hardening — keys only, my user only.
# Installed by sshd/install.sh (copied, not stowed). sshd uses the FIRST value
# it reads for each keyword, so this file sorts before 99-archlinux.conf.

PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
AllowUsers marek
X11Forwarding no
